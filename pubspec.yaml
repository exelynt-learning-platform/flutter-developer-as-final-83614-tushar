name: employee_management
description: "Employee Management Application with Firebase Auth, REST API, and Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  get_it: ^9.1.1

  dio: ^5.9.0

  dartz: ^0.10.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.6.1

  google_sign_in: ^6.2.2

  go_router: ^17.0.0

  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
